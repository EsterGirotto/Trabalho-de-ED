<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Estruturas de Dados</title>
  <link rel="stylesheet" href="../css/styles.css?v=5">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-info">
      <a class="brand login-brand" href="index.html">
        <span class="brand-mark">ED</span>
        <span>Estruturas de Dados</span>
      </a>
      <p class="eyebrow">Acesso ao ambiente</p>
      <h1>Entre para continuar estudando</h1>
    </section>

    <section class="login-card" aria-label="Formul&aacute;rio de login">
      <h2>Login</h2>
      <form action="../php/login.php" method="post">
        <div class="form-message" data-form-message></div>
        <input type="hidden" name="next" value="">

        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="seuemail@exemplo.com" required>

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" placeholder="Digite sua senha" required>

        <div class="form-row">
          <label class="remember"><input type="checkbox" name="lembrar"> Lembrar acesso</label>
          <a href="cadastro.html">Criar nova conta</a>
        </div>

        <button class="button primary full" type="submit">Entrar</button>
      </form>
      <p class="login-note">Ainda n&atilde;o possui conta? <a href="cadastro.html">Criar cadastro</a></p>
      <a class="back-home" href="index.html">Voltar para o in&iacute;cio</a>
    </section>
  </main>
  <footer class="login-footer">
    <p>&copy; 2026 Ester Girotto, Kepler Yuri, Kevyn Yuj. Todos os direitos reservados.</p>
  </footer>
  <script src="../js/auth-status.js?v=5"></script>
  <script src="../js/form-feedback.js?v=5"></script>
</body>
</html>
